---
# Service credentials may be set in YAML; matching env vars override them.

challenge:
  channel_id: 0
  time_limit: 0

game_modes:
  moving:
    settings:
      forbid_moving: false
      forbid_rotating: false
      forbid_zooming: false
  nm:
    settings:
      forbid_moving: true
      forbid_rotating: false
      forbid_zooming: false
  nmpz:
    settings:
      forbid_moving: true
      forbid_rotating: true
      forbid_zooming: true

pools:
  - name: "World"
    maps:
      - name: "A Community World"
        map_id: "62a44b22040f04bd36e8a914"
        game_modes: ["moving", "nm", "nmpz"]

  - name: "Learnable Meta Europe"
    learnable_meta:
      region: "Europe"
      is_shared: true
    game_modes: ["nm", "nmpz"]

# Replace IDs before use.
spam_detection:
  mode: alert
  guild_id: 1
  moderation_channel_id: 2
  onnx:
    model: tanaos-spam-detection-v1
    version: v1
  openrouter: {}
