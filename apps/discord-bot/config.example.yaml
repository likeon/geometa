---
# Service credentials may be set in YAML; matching env vars override them.

challenge:
  channel_id: 0
  time_limit: 0
  game_mode: nm

game_modes:
  moving:
    settings:
      forbid_moving: false
      forbid_rotating: false
      forbid_zooming: false
  nm:
    settings:
      forbid_moving: true
      forbid_rotating: false
      forbid_zooming: false
  nmpz:
    settings:
      forbid_moving: true
      forbid_rotating: true
      forbid_zooming: true

# Replace IDs before use.
spam_detection:
  mode: alert
  guild_id: 1
  moderation_channel_id: 2
  onnx:
    model: tanaos-spam-detection-v1
    version: v1
  # Shared policy for stage two + council; omitted fields use built-in defaults.
  # Override instructions, spam_criteria, safe_criteria with YAML |- blocks.
  prompt: {}
  openrouter:
    model: openai/gpt-6-luna-decisions
    spam_threshold: 0.9
  council:
    consensus: unanimous
    members:
      - name: chat-review
        type: chat
        model: xiaomi/mimo-v2.5
      - name: decision-review
        type: decisions
        model: openai/gpt-6-luna-decisions
        spam_threshold: 0.9
  recent_checks:
    ttl_seconds: 600
    failure_cooldown_seconds: 30
    max_entries: 1024
