apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nats
spec:
  interval: 10m
  timeout: 10m
  releaseName: nats
  chart:
    spec:
      chart: nats
      version: 2.15.0
      sourceRef:
        kind: HelmRepository
        name: nats
  valuesFrom:
    - kind: ConfigMap
      name: nats-values
