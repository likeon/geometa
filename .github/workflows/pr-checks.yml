name: PR checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      frontend: ${{ steps.filter.outputs.frontend }}
      discord_bot: ${{ steps.filter.outputs.discord_bot }}
    steps:
      - name: Detect changed apps
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'mise.toml'
              - '.github/workflows/pr-checks.yml'
            frontend:
              - 'apps/frontend/**'
              - 'apps/api/**'
              - 'mise.toml'
              - '.github/workflows/pr-checks.yml'
            discord_bot:
              - 'apps/discord-bot/**'
              - 'mise.toml'
              - '.github/workflows/pr-checks.yml'

  api:
    name: API lint and type-check
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run type-check

  frontend:
    name: Frontend lint and type-check
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"

      - name: Install API dependencies
        working-directory: apps/api
        run: bun install --frozen-lockfile

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run check

  discord-bot:
    name: Discord bot check and Clippy
    needs: changes
    if: ${{ needs.changes.outputs.discord_bot == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/discord-bot
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: apps/discord-bot -> target

      - name: Check
        run: cargo check --locked --all-targets --all-features

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  pr-checks:
    name: PR checks
    needs: [changes, api, frontend, discord-bot]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          API_RESULT: ${{ needs.api.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          DISCORD_BOT_RESULT: ${{ needs.discord-bot.result }}
        run: |
          results=(
            "$CHANGES_RESULT"
            "$API_RESULT"
            "$FRONTEND_RESULT"
            "$DISCORD_BOT_RESULT"
          )
          for result in "${results[@]}"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "Required check failed with result: $result"
              exit 1
            fi
          done
