name: Build docs

on:
  pull_request:
    paths:
      - apps/docs/**
      - .github/workflows/build-docs.yml
  push:
    branches: [main]
    paths:
      - apps/docs/**
      - "!apps/docs/flux/**"
      - .github/workflows/build-docs.yml
  workflow_dispatch:

env:
  FLUX_RECEIVER_DOCS: ${{ secrets.FLUX_RECEIVER_DOCS }}

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Prepare
        id: prep
        run: |
          BRANCH=${GITHUB_REF##*/}
          TS=$(date +%s)
          REVISION=${GITHUB_SHA::8}
          BUILD_ID="${BRANCH}-${REVISION}-${TS}"
          echo BUILD_ID=${BUILD_ID} >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: apps/docs
          file: apps/docs/Dockerfile
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/likeon/geometa-docs:${{ steps.prep.outputs.BUILD_ID }}
          cache-from: type=gha,scope=${{ github.workflow }}
          cache-to: type=gha,scope=${{ github.workflow }},mode=max

      - name: Notify Flux
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.FLUX_RECEIVER_DOCS != ''
        run: curl --fail --show-error -X GET "${FLUX_RECEIVER_DOCS}"
